.leg i{display:inline-block;width:10px;height:6px;margin-right:4px;vertical-align:middle}
footer{position:fixed;left:22px;bottom:18px;font-size:10px;color:var(--mut);max-width:520px;line-height:1.5}

function bNome(){ return ST.bs.map(function(b){ return MARCAS.filter(function(m){return m[0]===b;})[0][1]; }).join(' + '); }
function hbMode(){ return ST.f==='so'&&ST.bs.length===3&&['OFF!','EXPOSIS','RAID'].every(function(b){return ST.bs.indexOf(b)>=0;}); }
/* todas as marcas marcadas = total do cliente (igual a 'Todas'), mensal até Nov */
function fullMode(){ return ST.f==='so'&&ST.bs.length===MARCAS.length-1; }
function mbMode(){ return ST.f==='so'&&ST.b!=='all'&&!hbMode()&&!fullMode(); }
function cmpTxt(){ return mbMode()?'vs 2025':'vs FY26'; }
var PLAB='Jul–'+MES[MES.length-1];

function val(c,ano){ // soma comparável: só meses com dado em 2026
  if(c.none) return {v:null,pend:0,ms:1};
  if(c.y26!==undefined && ST.p==='T') return {v:c['y'+ano],pend:0,ms:1};
  var a26=c[ST.m+'26'], a=c[ST.m+ano], ms=ST.p==='T'?MES.map(function(_,i){return i;}):[ST.p], s=0, n=0, pend=0;
  ms.forEach(function(i){ if(a26[i]==null){pend++;return;} s+=a[i]; n++; });
  return {v:n?s:null, pend:pend, ms:ms.length};
}
function fmt(v,c){
  if(v==null) return '—';
  if(c&&c.un) return Math.round(v).toLocaleString('pt-BR')+' un';
  if(ST.f==='si') return Math.round(v).toLocaleString('pt-BR')+' cx';
  if(ST.m==='u') return Math.round(v).toLocaleString('pt-BR')+' un';
  return v>=1e6?'R$ '+(v/1e6).toFixed(2).replace('.',',')+' mi':'R$ '+Math.round(v/1e3).toLocaleString('pt-BR')+' mil';
}
function pct(a,b){ if(a==null||!b) return null; return (a/b-1)*100; }
function pctTxt(p){ return p==null?'':(p>=0?'▲ +':'▼ ')+p.toFixed(1).replace('.',',')+'%'; }

/* ── cena ── */
var cv=document.getElementById('cv');
var R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene(); S.fog=new THREE.FogExp2(0x06060a,0.028);
var cam=new THREE.PerspectiveCamera(38,1,0.1,200);
cam.position.set(12,11,16);
var ctl=new THREE.OrbitControls(cam,cv);
ctl.target.set(0,2.4,0); ctl.enableDamping=true; ctl.dampingFactor=.06; ctl.autoRotate=true; ctl.autoRotateSpeed=.35;
ctl.minDistance=8; ctl.maxDistance=40; ctl.maxPolarAngle=Math.PI*.46;
ctl.addEventListener('start',function(){ctl.autoRotate=false;});

S.add(new THREE.AmbientLight(0xfff1cc,.35));
var dl=new THREE.DirectionalLight(0xffe2a0,.9); dl.position.set(6,14,8); S.add(dl);
var pl=new THREE.PointLight(0xf5c542,1.4,30); pl.position.set(0,6,0); S.add(pl);

var GOLD=0xf5c542;
var W=17, D=8; // plataforma
// piso
var floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({color:0x14100a,metalness:.6,roughness:.45,transparent:true,opacity:.92}));
floor.rotation.x=-Math.PI/2; S.add(floor);
// borda + grade
function line(pts,op){ var g=new THREE.BufferGeometry().setFromPoints(pts.map(function(p){return new THREE.Vector3(p[0],p[1],p[2]);})); return new THREE.Line(g,new THREE.LineBasicMaterial({color:GOLD,transparent:true,opacity:op})); }
S.add(line([[-W/2,.01,-D/2],[W/2,.01,-D/2],[W/2,.01,D/2],[-W/2,.01,D/2],[-W/2,.01,-D/2]],.9));
S.add(line([[-W/2-.5,.01,-D/2-.5],[W/2+.5,.01,-D/2-.5],[W/2+.5,.01,D/2+.5],[-W/2-.5,.01,D/2+.5],[-W/2-.5,.01,-D/2-.5]],.25));
for(var gx=-W/2+1;gx<W/2;gx+=1) S.add(line([[gx,.005,-D/2],[gx,.005,D/2]],.06));
for(var gz=-D/2+1;gz<D/2;gz+=1) S.add(line([[-W/2,.005,gz],[W/2,.005,gz]],.06));
// cantoneiras brilhantes
[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(function(s){
  var x=s[0]*(W/2+.5), z=s[1]*(D/2+.5), L=1.4;
  var m=new THREE.Mesh(new THREE.BoxGeometry(L,.08,.12),new THREE.MeshBasicMaterial({color:GOLD})); m.position.set(x-s[0]*L/2,.05,z); S.add(m);
  var n=new THREE.Mesh(new THREE.BoxGeometry(.12,.08,L),new THREE.MeshBasicMaterial({color:GOLD})); n.position.set(x,.05,z-s[1]*L/2); S.add(n);
});
// grade de fundo infinita
var gh=new THREE.GridHelper(120,60,0x3a2f14,0x1a1508); gh.position.y=-.6; S.add(gh);
// poeira
(function(){ var n=600,p=new Float32Array(n*3); for(var i=0;i<n;i++){p[i*3]=(Math.random()-.5)*70;p[i*3+1]=Math.random()*25;p[i*3+2]=(Math.random()-.5)*70;}
  var g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(p,3));
  S.add(new THREE.Points(g,new THREE.PointsMaterial({color:GOLD,size:.06,transparent:true,opacity:.55}))); })();
// textura de brilho (glow) para baixo das barras
var glowTex=(function(){ var c=document.createElement('canvas'); c.width=c.height=128; var x=c.getContext('2d');
  var g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,214,102,.9)'); g.addColorStop(.4,'rgba(245,197,66,.25)'); g.addColorStop(1,'rgba(245,197,66,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();

var HMAX=6.2, BW=1.15, GAP=W/C.length;
var lbBox=document.getElementById('labels');
var bars=C.map(function(c,i){
  var x=-W/2+GAP*(i+.5);
  var mat=new THREE.MeshStandardMaterial({color:0xc9961f,emissive:GOLD,emissiveIntensity:.55,metalness:.5,roughness:.3,transparent:true,opacity:.95});
  var b=new THREE.Mesh(new THREE.BoxGeometry(BW,1,BW),mat); b.position.set(x,.5,.6); b.scale.y=.001; S.add(b);
  var eg=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(BW,1,BW)),new THREE.LineBasicMaterial({color:0xffe9a8})); b.add(eg);
  var gm=new THREE.Mesh(new THREE.BoxGeometry(BW*.9,1,BW*.9),new THREE.MeshBasicMaterial({color:GOLD,transparent:true,opacity:.07,depthWrite:false}));
  gm.position.set(x,.5,-1.6); gm.scale.y=.001; S.add(gm);
  var ge=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(BW*.9,1,BW*.9)),new THREE.LineBasicMaterial({color:GOLD,transparent:true,opacity:.55})); gm.add(ge);
  var gl=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2),new THREE.MeshBasicMaterial({map:glowTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  gl.rotation.x=-Math.PI/2; gl.position.set(x,.02,.6); S.add(gl);
  var lb=document.createElement('div'); lb.className='lb'; lbBox.appendChild(lb);
  var nm=document.createElement('div'); nm.className='nm'; nm.textContent=c.nome; lbBox.appendChild(nm);
  return {c:c,b:b,g:gm,gl:gl,lb:lb,nm:nm,h:0,ht:0,gh:0,ght:0,x:x,xt:x,rk:i};
});

function update(){
  var vs=bars.map(function(o){ return {a:val(o.c,'26'),p:val(o.c,'25')}; });
  var MB=mbMode(), HBm=hbMode()||fullMode(), fora=function(o){ return MB&&o.c.un; }; // Clamed em unidades fica fora do total por marca
  var mx=0; vs.forEach(function(v,i){ if(fora(bars[i])) return; mx=Math.max(mx,v.a.v||0,v.p.v||0); });
  /* ordem decrescente pelo valor 2026 da métrica/período escolhidos (maior à esquerda) */
  bars.map(function(o,i){ return {o:o,v:fora(o)?-1:(vs[i].a.v||0)}; }).sort(function(a,b){ return b.v-a.v; })
    .forEach(function(r,k){ r.o.rk=k; r.o.xt=-W/2+GAP*(k+.5); });
  var t26=0,t25=0,best=null,pendAny=false,unB=null,fmtK=fmt;
  bars.forEach(function(o,i){
    var v=vs[i], f=fora(o); o.ht=(!f&&v.a.v)?v.a.v/mx*HMAX:0.02; o.ght=(!f&&v.p.v)?v.p.v/mx*HMAX:0.02;
    var p=pct(v.a.v,v.p.v);
    if(o.c.none){ o.lb.innerHTML='<div class="v">—</div><div class="pend">sem venda da marca</div>'; return; }
    o.lb.innerHTML='<div class="v">'+fmt(v.a.v,o.c)+'</div>'+(p!=null?'<div class="d '+(p>=0?'up':'down')+'">'+pctTxt(p)+' '+cmpTxt()+'</div>':'')+
      (f?'<div class="pend">só unidades · fora do total</div>':'')+
      (v.a.pend?'<div class="pend">'+(v.a.pend===v.a.ms?'receita pendente':'receita '+(v.a.ms-v.a.pend)+' de '+v.a.ms+' meses')+'</div>':'');
    if(v.a.pend) pendAny=true;
    if(v.a.v!=null&&!f){ t26+=v.a.v; t25+=v.p.v; if(!best||v.a.v>best.v) best={n:o.c.nome,v:v.a.v}; }
    if(f&&v.a.v!=null) unB={n:o.c.nome,v:v.a.v,p:v.p.v,c:o.c};
  });
  /* marca vendida só onde a base é em unidades (ex.: Pato Block só na Clamed): KPIs em unidades */
  if(!best&&unB){ best={n:unB.n,v:unB.v}; t26=unB.v; t25=unB.p; fmtK=function(v){ return fmt(v,unB.c); }; }
  if(ST.f==='si'){ (ST.p==='T'?MES.map(function(_,i){return i;}):[ST.p]).forEach(function(i){ t25+=SI.ext25[i]||0; t26+=SI.ext26[i]||0; }); }
  var tp=pct(t26,t25), plb=ST.p==='T'?PLAB+'/26':MES[ST.p]+'/26';
  var parc=ST.f==='si'&&SI.parcial&&(ST.p==='T'||ST.p===MES.length-1);
  var cres=bars.map(function(o,i){return {n:o.c.nome,p:fora(o)?null:pct(vs[i].a.v,vs[i].p.v)};}).filter(function(x){return x.p!=null;}).sort(function(a,b){return b.p-a.p;})[0];
  var mNome=fullMode()?' todas as marcas':(MB||HBm)?' '+bNome():'';
  document.getElementById('kpis').innerHTML=
    '<div class="k"><div class="l">'+(ST.f==='si'?'Sell In acumulado':'Sell Out'+mNome+((MB||HBm)?'':' total'))+' · '+plb+(parc?' (Nov parcial)':'')+'</div><div class="n">'+(best?fmtK(t26):'—')+'</div><div class="s '+(tp>=0?'up':'down')+'">'+pctTxt(tp)+' '+cmpTxt()+'</div></div>'+
    '<div class="k"><div class="l">Maior cliente</div><div class="n" style="font-size:17px">'+(best?best.n:'—')+'</div><div class="s" style="color:var(--mut)">'+(best?fmtK(best.v)+' · '+(best.v/t26*100).toFixed(0)+'% do total':'')+'</div></div>'+
    '<div class="k"><div class="l">Maior crescimento</div><div class="n" style="font-size:17px">'+(cres?cres.n:'—')+'</div><div class="s '+(cres&&cres.p<0?'down':'up')+'">'+(cres?pctTxt(cres.p):'')+'</div></div>';
  document.getElementById('nota').textContent=ST.f==='si'?'Sell In em caixas (real) · '+SI.parcial+' parcial, comparado com o mês cheio do FY26'+(SI.extNomes?' · total inclui '+SI.extNomes+' (sem barra)':'')+' · Sell In não tem quebra por marca. '
    :fullMode()?'Todas as marcas marcadas = Sell Out total do cliente por mês (igual a Todas), FY27 × FY26 até '+MES[MES.length-1]+'/26 (Nov parcial vs Nov/25 cheio). '
    :HBm?'OFF + Exposis + Raid = linha HB do dashboard por mês, FY27 × FY26 (até '+MES[MES.length-1]+'/26; Nov parcial vs Nov/25 cheio) · São João só Isadora · DD-Gaúcha inclui Glade e GAM/Riomed incluem Lysoform/Pato residuais (o mensal não tem quebra por marca) · Clamed: receita só até Jul/26. '
    :MB?'Por marca: acumulado '+PLAB+'/26 × '+PLAB+'/25 e cada mês × mesmo mês de 2025 · Nov/26 parcial até 11/11 (vs Nov/25 cheio) · Jan–Set = base SKU do card Sell-out por Marca; Out/Nov = total do cliente no dashboard quebrado por marca (real: Panvel, Nissei, Riomed e GAM Nov; estimado pelo mix de Set: São João, Gaúcha, GAM Out e Clamed) · São João = Isadora + Caroline · Clamed só em unidades (fora do total). '
    :(ST.m==='r'&&pendAny)?'Clamed: receita de Ago–Out/26 ainda não está na planilha; a comparação usa só os meses com dado. ':(ST.m==='u'?'Panvel FY26 em unidades é estimado (receita ÷ ticket médio). ':'');
}

/* hover → detalhe */
var ray=new THREE.Raycaster(), mouse=new THREE.Vector2(-9,-9), hov=null, det=document.getElementById('det');
cv.addEventListener('pointermove',function(e){ mouse.x=e.clientX/innerWidth*2-1; mouse.y=-(e.clientY/innerHeight)*2+1; });
cv.addEventListener('pointerleave',function(){ mouse.set(-9,-9); });
function showDet(o){
  if(!o){ det.classList.remove('on'); return; }
  var c=o.c, a=c[ST.m+'26'].slice(), p=c[ST.m+'25'].slice(), lb=MES.slice(), MB=c.y26!==undefined;
  if(MB){ a.unshift(c.y26); p.unshift(c.y25); lb.unshift(PLAB); }
  var mx=0; for(var i=0;i<lb.length;i++) mx=Math.max(mx,a[i]||0,p[i]||0);
  var h='<h3>'+c.nome+'</h3><div class="sub">'+(ST.f==='si'?'Sell In (caixas) por mês · FY27 × FY26':MB?(ST.bs.length>1?'Marcas ':'Marca ')+bNome()+' · 2026 × 2025':(ST.m==='r'?'Receita':'Unidades')+' por mês · FY27 × FY26')+'</div>';
  if(c.none) h+='<div class="sub">Sem venda desta marca no cliente.</div>';
  else for(var i=0;i<lb.length;i++){ var q=pct(a[i],p[i]);
    h+='<div class="mb"><span style="color:var(--mut)">'+lb[i]+'</span><div class="bars"><div class="b c" style="width:'+((a[i]||0)/(mx||1)*100)+'%"></div><div class="b a" style="width:'+((p[i]||0)/(mx||1)*100)+'%"></div></div><span class="r">'+fmt(a[i],c)+(q!=null?'<br><span class="'+(q>=0?'up':'down')+'">'+pctTxt(q)+'</span>':'')+'</span></div>'; }
  det.innerHTML=h+'<div class="leg"><span><i style="background:var(--gold2)"></i>2026</span><span><i style="background:rgba(245,197,66,.3);border:1px solid rgba(245,197,66,.5)"></i>2025</span></div>';
  det.classList.add('on');
}

/* controles */
function seg(id,key){ document.getElementById(id).addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  [].forEach.call(this.children,function(x){x.classList.remove('on');}); b.classList.add('on');
  var v=b.dataset[key]; ST[key]=v==='T'||v==='r'||v==='u'?v:+v; bars.forEach(function(o){o.h*=.0001;o.gh*=.0001;}); update(); if(hov) showDet(hov); }); }
function buildPer(){ document.getElementById('segP').innerHTML=MES.map(function(m,i){return '<button data-p="'+i+'">'+m+'</button>';}).join('')+'<button data-p="T" class="on">'+PLAB+'</button>'; }
buildPer();
/* troca de base: Sell Out (todas as marcas) · Sell Out por marca · Sell In */
function applyDS(){
  var MB=mbMode(), DS=ST.f==='si'?SI:fullMode()?SO:hbMode()?HB:MB?brandDS(ST.bs):SO;
  MES=DS.MES; PLAB=DS.PLAB||('Jul–'+MES[MES.length-1]); ST.p='T'; ST.m=ST.f==='si'?'u':MB?'r':ST.mSO;
  bars.forEach(function(o){ o.c=DS.C.filter(function(c){return c.id===o.c.id;})[0]; o.h*=.0001; o.gh*=.0001; });
  document.getElementById('segM').style.display=(ST.f==='si'||MB)?'none':'';
  document.getElementById('segB').style.display=ST.f==='si'?'none':'';
  document.getElementById('ttl').textContent=ST.f==='si'?'Sell In ':'Sell Out ';
  document.getElementById('fy').textContent=MB?PLAB+'/26':'FY27';
  buildPer(); update(); if(hov) showDet(hov);
}
document.getElementById('segF').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b||b.dataset.f===ST.f) return;
  [].forEach.call(this.children,function(x){x.classList.remove('on');}); b.classList.add('on');
  if(ST.f==='so'&&ST.b==='all') ST.mSO=ST.m;
  ST.f=b.dataset.f; applyDS(); });
document.getElementById('segB').innerHTML=MARCAS.map(function(m){ return '<button data-b="'+m[0]+'"'+(m[0]==='all'?' class="on"':'')+'>'+m[1]+'</button>'; }).join('');
/* marca: clique marca/desmarca (dá para somar OFF + Exposis + Raid); 'Todas' limpa a seleção */
document.getElementById('segB').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  var v=b.dataset.b, bs=ST.bs.slice();
  if(v==='all'){ if(!bs.length) return; bs=[]; }
  else { var i=bs.indexOf(v); if(i>=0) bs.splice(i,1); else bs.push(v); }
  bs=MARCAS.map(function(m){return m[0];}).filter(function(m){ return bs.indexOf(m)>=0; });
  if(ST.b==='all') ST.mSO=ST.m;
  ST.bs=bs; ST.b=bs.length?bs.join('|'):'all';
  [].forEach.call(this.children,function(x){ x.classList.toggle('on', x.dataset.b==='all'?!bs.length:bs.indexOf(x.dataset.b)>=0); });
  applyDS(); });
document.getElementById('fonte').textContent=FONTE;
document.getElementById('fs').onclick=function(){ var d=document; if(d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen(); };
seg('segM','m'); seg('segP','p');

function resize(){ R.setSize(innerWidth,innerHeight,false); cam.aspect=innerWidth/innerHeight; cam.fov=innerWidth<760?55:38; cam.updateProjectionMatrix(); }
addEventListener('resize',resize); resize(); update();

var v3=new THREE.Vector3(), clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  var t=clk.getElapsedTime();
  ctl.update();
  ray.setFromCamera(mouse,cam);
  var hit=ray.intersectObjects(bars.map(function(o){return o.b;}).concat(bars.map(function(o){return o.g;})))[0], nh=null;
  if(hit) bars.forEach(function(o){ if(o.b===hit.object||o.g===hit.object) nh=o; });
  if(nh!==hov){ hov=nh; showDet(hov); cv.style.cursor=hov?'pointer':''; }
  bars.forEach(function(o,i){
    o.h+=(o.ht-o.h)*.07; o.gh+=(o.ght-o.gh)*.07; o.x+=(o.xt-o.x)*.08;
    o.b.position.x=o.x; o.g.position.x=o.x; o.gl.position.x=o.x;
    o.b.scale.y=Math.max(o.h,.001); o.b.position.y=o.h/2;
    o.g.scale.y=Math.max(o.gh,.001); o.g.position.y=o.gh/2;
    var on=o===hov;
    o.b.material.emissiveIntensity=(on?1.1:.5)+Math.sin(t*2+i)*.06;
    o.gl.material.opacity=on?1:.6;
    v3.set(o.x,o.h+.35+(o.rk%2?1.1:0),.6).project(cam);
    o.lb.style.left=(v3.x*.5+.5)*innerWidth+'px'; o.lb.style.top=(-v3.y*.5+.5)*innerHeight+'px'; o.lb.style.opacity=v3.z<1?1:0;
    v3.set(o.x,0,D/2+.3).project(cam);
    o.nm.style.left=(v3.x*.5+.5)*innerWidth+'px'; o.nm.style.top=(-v3.y*.5+.5)*innerHeight+'px';
  });
  pl.intensity=1.2+Math.sin(t*1.3)*.25;
  R.render(S,cam);
})();
</script>
